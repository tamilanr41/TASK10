<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540" fill="none">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF2E9"/><stop offset="1" stop-color="#F5E6D3"/>
    </linearGradient>
    <pattern id="tex" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.3" fill="#E8D5C4" opacity="0.5"/>
      <circle cx="5" cy="5" r="0.2" fill="#E8D5C4" opacity="0.3"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="0.5"/></filter>
  </defs>
  <rect width="480" height="540" rx="16" fill="white"/>
  <rect width="480" height="540" rx="16" fill="url(#tex)" opacity="0.4"/>

  <!-- Two dermoscopy views side by side -->
  <g transform="translate(80 270)" filter="url(#blur)">
    <!-- Scalp view -->
    <circle r="110" fill="url(#skin)"/>
    <circle r="110" fill="url(#tex)"/>
    <g fill="#C9B8A6">
      <circle cx="-70" cy="-50" r="5"/><circle cx="-40" cy="-65" r="4.5"/>
      <circle cx="-10" cy="-45" r="5"/><circle cx="20" cy="-60" r="4.5"/>
      <circle cx="50" cy="-55" r="5"/><circle cx="75" cy="-40" r="4.5"/>
      <circle cx="-55" cy="-10" r="5"/><circle cx="-15" cy="-25" r="5"/>
      <circle cx="25" cy="-15" r="4.5"/><circle cx="65" cy="-20" r="5"/>
      <circle cx="-60" cy="35" r="5"/><circle cx="-20" cy="45" r="5"/>
      <circle cx="20" cy="30" r="5"/><circle cx="60" cy="40" r="4.5"/>
    </g>
    <g stroke="#8B7D6B" stroke-width="2" stroke-linecap="round" opacity="0.6" fill="none">
      <path d="M-70 -50 q-5 -12 -8 -28"/><path d="M-40 -65 q0 -15 3 -30"/>
      <path d="M-10 -45 q6 -12 10 -28"/><path d="M20 -60 q0 -16 2 -34"/>
    </g>
    <text x="0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6B7280">SCALP DERMOSCOPY</text>
  </g>

  <g transform="translate(320 270)" filter="url(#blur)">
    <!-- Nail view -->
    <rect x="-85" y="-85" width="170" height="170" rx="20" fill="#FBF5EB"/>
    <rect x="-85" y="-85" width="170" height="170" rx="20" fill="url(#tex)" opacity="0.4"/>
    <!-- Nail plate -->
    <path d="M-55 -60 C -45 -65 -30 -65 -20 -62 L 20 -60 C 30 -58 35 -40 33 -20 C 32 -10 28 -2 20 4 L -20 6 C -30 6 -38 4 -42 -10 L -52 -50 Z" fill="#F5E6D3" stroke="#E8D5C4" stroke-width="1.5"/>
    <path d="M-55 -60 C -45 -65 -30 -65 -20 -62 L 20 -60 C 30 -58 35 -40 33 -20 C 32 -10 28 -2 20 4 L -20 6 C -30 6 -38 4 -42 -10 L -52 -50 Z" fill="url(#skin)" opacity="0.6"/>
    <!-- Longitudinal striations -->
    <g stroke="#D4C4B0" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M-48 -55 q30 6 42 4"/><path d="M-48 -35 q30 8 42 2"/>
      <path d="M-48 -15 q28 8 40 2"/><path d="M-48 5 q24 6 36 2"/>
    </g>
    <!-- Discoloration -->
    <ellipse cx="8" cy="8" rx="14" ry="9" fill="#FECACA" opacity="0.3"/>
    <ellipse cx="8" cy="8" rx="14" ry="9" stroke="#EF4444" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6B7280">NAIL DERMOSCOPY</text>
  </g>

  <!-- Header -->
  <text x="240" y="40" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" letter-spacing="2" fill="#059669">DERMAI • CLINICAL IMAGING</text>

  <!-- Connecting line -->
  <path d="M190 270 Q240 250 290 270" stroke="#059669" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 4" fill="none"/>

  <!-- Tags -->
  <g font-family="ui-monospace,monospace" font-size="11" fill="#374151">
    <rect x="30" y="460" width="130" height="30" rx="15" fill="#F0FDF4" stroke="#D1FAE5"/>
    <circle cx="42" cy="475" r="3.5" fill="#059669"/><text x="54" y="480" fill="#059669">SCALP ✓</text>
    <rect x="320" y="460" width="120" height="30" rx="15" fill="#FEFCE8" stroke="#FDE68A"/>
    <circle cx="332" cy="475" r="3.5" fill="#D97706"/><text x="344" y="480" fill="#D97706">NAILS ✓</text>
    <rect x="175" y="495" width="130" height="30" rx="15" fill="#F0FDF4" stroke="#D1FAE5"/>
    <circle cx="187" cy="510" r="3.5" fill="#059669"/><text x="199" y="515" fill="#059669">FUSION READY</text>
  </g>

  <rect x="8" y="8" width="464" height="524" rx="12" stroke="#E5E7EB" stroke-width="2" fill="none"/>
</svg>