    <!-- Subungual hyperkeratosis / discoloration -->
    <ellipse cx="2" cy="2" rx="16" ry="10" fill="#FECACA" opacity="0.35"/>
    <ellipse cx="2" cy="2" rx="16" ry="10" stroke="#EF4444" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <!-- Proximal nail fold -->
  <path d="M-50 -55 C -40 -62 -25 -62 -15 -58" stroke="#E8D5C4" stroke-width="2" fill="none" opacity="0.7"/>
