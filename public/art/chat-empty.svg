<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200" fill="none">
  <defs>
    <pattern id="tex" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.3" fill="#E8D5C4" opacity="0.3"/>
    </pattern>
  </defs>
  <rect x="20" y="20" width="260" height="160" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="20" y="20" width="260" height="160" rx="12" fill="url(#tex)" opacity="0.2"/>

  <!-- Clinical chat bubble -->
  <ellipse cx="150" cy="90" rx="90" ry="55" fill="#F0FDF4" stroke="#D1FAE5" stroke-width="1.5"/>
  <ellipse cx="150" cy="90" rx="90" ry="55" fill="url(#tex)" opacity="0.3"/>
  <text x="150" y="75" text-anchor="middle" fill="#059669" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5">DERMAI ASSISTANT</text>
  <text x="150" y="95" text-anchor="middle" fill="#374151" font-size="13">Ask about scalp, hair, nails,</text>
  <text x="150" y="112" text-anchor="middle" fill="#374151" font-size="13">nutrition, or your results.</text>
  <text x="150" y="130" text-anchor="middle" fill="#9CA3AF" font-size="11">"What helps dry scalp?" · "Latest screening"</text>

  <!-- Typing indicator -->
  <g transform="translate(60 150)">
    <circle cx="0" cy="0" r="4" fill="#059669"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="14" cy="0" r="4" fill="#059669"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="28" cy="0" r="4" fill="#059669"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" begin="0.4s"/></circle>
  </g>
</svg>