<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none">
  <defs>
    <pattern id="tex" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.3" fill="#E8D5C4" opacity="0.5"/>
    </pattern>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="16" fill="white" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Scalp side (left) -->
  <circle cx="55" cy="70" r="48" fill="#FDF2E9" stroke="#E8D5C4" stroke-width="1.5"/>
  <circle cx="55" cy="70" r="48" fill="url(#tex)"/>
  <g fill="#C9B8A6">
    <circle cx="28" cy="45" r="3.5"/><circle cx="50" cy="38" r="3"/>
    <circle cx="72" cy="48" r="3.5"/><circle cx="88" cy="65" r="3"/>
    <circle cx="32" cy="80" r="3.5"/><circle cx="60" cy="85" r="3"/>
  </g>
  <g stroke="#8B7D6B" stroke-width="1.5" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M28 45 q-3 -8 -5 -18"/><path d="M50 38 q0 -10 2 -20"/>
    <path d="M72 48 q3 -8 5 -18"/>
  </g>

  <!-- Nail side (right) -->
  <g transform="translate(105 70) rotate(-12)">
    <path d="M-28 -30 C -22 -34 -14 -34 -8 -32 L 8 -30 C 14 -28 18 -12 16 2 C 15 16 12 20 6 22 L -4 24 C -14 24 -20 18 -24 8 L -32 -22 Z" fill="#FBF5EB" stroke="#E8D5C4" stroke-width="1.5"/>
    <path d="M-28 -30 C -22 -34 -14 -34 -8 -32 L 8 -30 C 14 -28 18 -12 16 2 C 15 16 12 20 6 22 L -4 24 C -14 24 -20 18 -24 8 L -32 -22 Z" fill="url(#tex)" opacity="0.5"/>
    <g stroke="#D4C4B0" stroke-width="1" fill="none" opacity="0.6">
      <path d="M-22 -25 q20 6 26 -2"/><path d="M-22 -5 q20 8 26 -2"/>
    </g>
  </g>

  <!-- Unifying ring -->
  <circle cx="80" cy="80" r="62" stroke="url(#ring)" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  <circle cx="80" cy="80" r="6" fill="#059669" opacity="0.2"/>
</svg>